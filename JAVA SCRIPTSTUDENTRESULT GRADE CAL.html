<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Student Result Dashboard</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background: url("./brianpenny-robot-8563414_1920.jpg");
            background-size: cover;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            text-decoration: underline;
            font-size: 50px;
            background-color: rgb(229, 10, 10);
            height: 100px;
            padding-top: 20px;
        }

        h2 {
            text-align: center;
        }

        div {
            margin: 40px auto;
            background-color: rgb(147, 250, 228);
            border: 5px solid black;
            width: 420px;
            padding: 30px;
            border-radius: 8px;
        }

        label {
            display: inline-block;
            width: 130px;
            font-weight: normal;
            margin-bottom: 12px;
        }

        input {
            padding: 6px 10px;
            width: 200px;
            margin-bottom: 12px;
        }

        .buttonGroup {
            text-align: center;
            padding-top: 15px;
            padding-bottom: 10px;
        }

        button {
            padding: 8px 18px;
            margin: 0 8px;
            cursor: pointer;
        }

        #resultParagraph {
            text-align: left;
            font-size: 16px;
            padding-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <form>
        <h1>Interactive Student Result Dashboard</h1>
        <h2>----------------------------------------------------------------------------------------------------------------------------------</h2>
        <nav></nav>

        <div>
            <label for="studentNameInput">Student Name:</label>
            <input type="text" name="n1" id="studentNameInput"><br>

            <label for="studentRegInput">Student Reg:</label>
            <input type="text" name="n2" id="studentRegInput"><br>

            <label for="htmlMarksInput">HTML Marks:</label>
            <input type="number" name="n3" id="htmlMarksInput"><br>

            <label for="cssMarksInput">CSS Marks:</label>
            <input type="number" name="n4" id="cssMarksInput"><br>

            <label for="jsMarksInput">JS Marks:</label>
            <input type="number" name="n5" id="jsMarksInput"><br>

            <div class="buttonGroup" style="margin: 0; padding: 10px 0; border: none; width: 100%; background: transparent;">
                <button onclick="Check()" type="button">Results</button>
                <button type="reset">Reset</button>
            </div>

            <p id="resultParagraph"></p>
        </div>
    </form>

    <script>
        function Check() {
            let n1 = document.getElementById('studentNameInput').value;
            let n2 = document.getElementById('studentRegInput').value;
            let n3 = Number(document.getElementById('htmlMarksInput').value);
            let n4 = Number(document.getElementById('cssMarksInput').value);
            let n5 = Number(document.getElementById('jsMarksInput').value);
            let total = n3 + n4 + n5;
            let Avg = total / 3;
            let percentage = (total / 300) * 100;
            let grade;

            if (Avg >= 80) {
                grade = "A+";
            } else if (Avg >= 60) {
                grade = "B";
            } else if (Avg >= 40) {
                grade = "C";
            } else if (Avg < 40) {
                grade = "D";
            } else {
                grade = "Absent";
            }

            let status;
            if (Avg >= 40) {
                status = "Pass";
            } else {
                status = "Fail";
            }

            document.getElementById('resultParagraph').innerHTML =
                "<h3 style='text-align: center; text-decoration: underline; margin-bottom: 10px;'>STUDENT DETAILS</h3>"
                + "Student Name: " + n1 + "<br>"
                + "Student Reg: " + n2 + "<br>"
                + "HTML Marks: " + n3 + "<br>"
                + "CSS Marks: " + n4 + "<br>"
                + "JS Marks: " + n5 + "<br>"
                + "Total Marks: " + total + "<br>"
                + "Average Marks: " + Avg.toFixed(2) + "<br>"
                + "Percentage: " + percentage.toFixed(2) + "%<br>"
                + "Grade: " + grade + "<br>"
                + "Result: " + status;
        }
    </script>
</body>
</html>
