<html>
    <head>
        <title>Transtation&animation</title>
        <style>
            body {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 20px;
                padding: 20px;
                background-color: #ffffff;
            }
            .border-box {
                width: 140px;
                height: 140px;
                border: 2px solid #000000;
                display: flex;
                justify-content: center;
                align-items: center;
                box-sizing: border-box;
            }
            button {
                text-align: center;
                width: 100px;
                height: 50px;
                border: none;
                background: red;
                border-radius: 8px;
                color: white;
                font-weight: bold;
                transition: 0.3s;
            }

            button:hover {
                background: blue;
                transform: scale(1.05);
            }
            .box {
                width: 80px;
                height: 80px;
                background: red;
                animation: pradeep 1s ease alternate infinite;
            }
            @keyframes pradeep {
                from {
                    transform: scale(1);
                }
                to {
                    transform: scale(0.2);
                }
            }

            .load1 {
                width: 80px;
                height: 80px;
                border-radius: 50%;
                border: 5px solid grey;
                border-top: 5px solid blue;
                animation: spin1 4s ease infinite;
                animation-delay: 1s;
                box-sizing: border-box;
            }

            @keyframes spin1 {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }

            .load2 {
                width: 80px;
                height: 80px;
                border-radius: 50%;
                border: 5px solid green;
                border-top: 5px solid red;
                border-bottom: 5px solid red;
                animation: spin2 1s linear infinite;
                box-sizing: border-box;
            }

            @keyframes spin2 {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }

            .load3 {
                width: 80px;
                height: 80px;
                border-radius: 50%;
                border: 5px dotted green;
                animation: spin3 9s linear infinite;
                box-sizing: border-box;
            }

            @keyframes spin3 {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }

            .load4 {
                width: 80px;
                height: 80px;
                border-radius: 50%;
                background: purple;
                animation: pulse 1s ease-in-out infinite alternate;
            }

            @keyframes pulse {
                from {
                    transform: scale(0.2);
                }
                to {
                    transform: scale(1);
                }
            }
        </style>
    </head>
    <body>
        <h1>Transtation&Animations</h1>

        <div class="border-box">
            <div class="box"></div>
        </div>

        <div class="border-box">
            <button>action</button>
        </div>

        <div class="border-box">
            <div class="load1"></div>
        </div>

        <div class="border-box">
            <div class="load2"></div>
        </div>

        <div class="border-box">
            <div class="load3"></div>
        </div>

        <div class="border-box">
            <div class="load4"></div>
        </div>
    </body>
</html>
