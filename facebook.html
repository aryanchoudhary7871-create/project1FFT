<html>
<head>
    <title>Facebook Login</title>
    <style>
        form
        {
            border: 1px solid #f10000;
            width: 350px;
            margin-left: 500px;
            margin-top: 100px;
            padding: 20px;
            background-color: rgb(254, 254, 254);
            border-radius: 8px;
            box-shadow: 10px 4px 10px gray;
            font-family: Arial, sans-serif;
        }
        h1 
        {
            text-align: center;
            color: #1877f2;
            font-size: 32px;
            margin-bottom: 20px;
        }
        label 
        {
            font-size: 14px;
            font-weight: bold;
        }
        button 
        {
            width: 100%;
            height: 40px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        #i1
        {
            width: 100%;
            height: 40px;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #i2
        {
            width: 100%;
            height: 40px;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #i3
        {
            background-color: #1877f2;
            color: white;
            margin-top: 10px;
        }
        #i4
        {
            background-color: #42b72a;
            color: white;
            margin-top: 15px;
        }
        #i3:hover{
            background-color: #7df825;
        }
        #i4:hover{
            background-color: #e83abf;
        }
    </style>
</head>
<body>
    <form>
        <h1>facebook</h1>

        <label>Email or Phone:</label><br>
        <input type="text" id="i1" placeholder="Email address or phone number"><br><br>

        <label>Password:</label><br>
        <input type="password" id="i2" placeholder="Password"><br><br>

        <button id="i3">Log In</button>
        <button id="i4">Create New Account</button>
    </form>
</body>
</html>
