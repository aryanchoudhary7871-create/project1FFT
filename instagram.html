<html>
<head>
    <title>Instagram Login</title>
    <style>
        body 
        {
            background-color: #fafafa;
            color: #262626;
            font-family: Arial, sans-serif;
        }
        form
        {
            border: 1px solid #dbdbdb;
            width: 360px;
            margin-left: 500px;
            margin-top: 60px;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 12px;
        }
        h1 
        {
            text-align: left;
            color: #ff07d2;
            font-size: 20px;
            margin-bottom: 25px;
        }
        button 
        {
            width: 100%;
            height: 48px;
            border-radius: 24px;
            font-size: 15px;
            border: none;
        }
        #i1
        {
            width: 100%;
            height: 52px;
            padding: 12px;
            background-color: #fafafa;
            color: #000000;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
        }
        #i2
        {
            width: 100%;
            height: 52px;
            padding: 12px;
            background-color: #fafafa;
            color: #000000;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
        }
        #i3
        {
            background-color: #0095f6;
            color: #ffffff;
            margin-top: 10px;
        }
        #i4
        {
            background-color: transparent;
            color: #000000;
            margin-top: 15px;
            font-size: 14px;
        }
        #i5
        {
            background-color: #eef5fd;
            color: #0095f6;
            margin-top: 30px;
        }
        #i6
        {
            background-color: transparent;
            color: #0095f6;
            border: 1px solid #0095f6;
            margin-top: 12px;
        }
        #i3:hover{
            background-color: #1877f2;
        }
        #i4:hover{
            color: #737373;
        }
        #i5:hover{
            background-color: #e0edfb;
        }
        #i6:hover{
            background-color: rgba(0, 149, 246, 0.08);
        }
    </style>
</head>
<body>
    <form>
        <h1>Log into Instagram</h1>

        <input type="text" id="i1" placeholder="Mobile number, username or email"><br><br>

        <input type="password" id="i2" placeholder="Password"><br><br>

        <button id="i3">Log in</button><br><br>

        <button id="i4">Forgot password?</button><br>

        <button id="i5">Log in with Facebook</button>

        <button id="i6">Create new account</button>
    </form>
</body>
</html>
