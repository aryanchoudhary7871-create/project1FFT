<html>

<head>
    <title>Student Registration Form</title>
    <style>
        form
        {
            border: 1px solid black;
            width: 500px;
            margin-left: 500px;
            padding-left: 40px;
            padding-bottom: 100px;
            background-color: rgb(147, 250, 228);
            border-radius: 20px;
            box-shadow: 4px 8px 10px;
        }
        h1 
        {
            text-align: center;
        }
        label 
        {
            
            width: 120px;
            text-align: left;
            margin-right: 10px;
            padding-left: 7px;
            
        }

        input 
        {
            box-sizing: border-box;
        }
        button 
        {
            width: 100px;
            margin-left: 134px;
        }
        #i1
        {
            width: 200px;
            margin-left: 20px;
            height: 30px;
        }
        #i2
        {
            width: 200px;
            margin-left: 25px;
            height: 30px;
        }
        #i3
        {
            margin-left: 30px;
        }
        #i4
        {
            width: 200px;
            margin-left: 25px;
            height: 30px;
        }
        #i5
        {
            width: 200px;
            margin-left: -7px;
            height: 30px;
            border: none;
        }
        #i6
        {
            width: 200px;
            margin-left: 14px;
            height: 30px;
        }
        #i7
        {
            width: 200px;
            margin-left: -12px;
            height: 30px;
        }
        #i8
        {
            width: 200px;
            margin-left: 17px;
            height: 30px;
        }
        #i9
        {
            width: 200px;
            margin-left: 14px;
            height: 30px;
        }
        #i10
        {
            width: 200px;
            margin-left: 9px;
            height: 30px;
        }
        #i11
        {
            width: 200px;
            margin-left: 13px;
            height: 30px;
        }
        #i12
        {
            margin-left: 100px;
            background-color: azure;
        
        }
        #i13
        {
            margin-left: 30px;
            background-color: blue;
            border-radius: 10px;
            border: none;
        }
        #i12:hover{
            background-color: aqua;
        }
        #i13:hover{
            background-color: bisque;
        }
    </style>
</head>
<body>
      <form>
        <h1>Student Registration Form</h1>

        <label>Reg Id:</label>
        <input type="number" id="i1" required placeholder="enter your reg id"><br><br>

        <label>Name:</label>
        <input type="text" id="i2"><br><br>

        <label>Gender:</label>
        Male <input type="radio" name="Gender">
        Female <input type="radio" name="Gender">
        Other <input type="radio" name="Gender"><br><br>

        <label>DOB:</label>
        <input type="date" id="i3"><br><br>

        <Label>Email:</label>
        <input type="email" id="i4"><br><br>

        <label>Mobile No:</label>
        <input type="number" id="i5"><br><br>

        <label>College:</label>
        <input type="text" id="i6"><br><br>

        <label>Department:</label>
        <input type="text" id="i7"><br><br>

        <label>Course:</label>
        <input type="text" id="i8"><br><br>

        <label>Section:</label>
        <input type="text" id="i9"><br><br>

        <label>Address:</label>
        <textarea id="i10"></textarea><br><br>

        <label>resume:</label>
        <input type="file" id="i11"><br><br>

        <button id="i12">Submit</button>
        <button id="i13">Reset</button>
      </form>
</body>
</html>
